<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natural Ocean - Sun Synced Lighting 60s</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061624}body{font-family:system-ui,sans-serif}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#74b8dc 0%,#b9dbea 35%,#e3e7dc 48%,#4d9cb5 49%,#0b5274 100%)}
.sky{z-index:0;position:absolute;left:0;right:0;top:0;height:55%;overflow:visible;background:linear-gradient(#69afd7,#c4dfe9 75%,#e8e5d5)}
.clouds,.clouds:before,.clouds:after{position:absolute;content:"";left:-10%;top:17%;width:120%;height:30%;filter:blur(14px);background:radial-gradient(ellipse at 15% 50%,rgba(255,255,255,.40) 0 8%,transparent 20%),radial-gradient(ellipse at 42% 38%,rgba(255,255,255,.32) 0 7%,transparent 18%),radial-gradient(ellipse at 77% 53%,rgba(255,255,255,.28) 0 9%,transparent 21%);animation:cloud 65.99s linear infinite alternate}.clouds:before{left:7%;top:10%;width:90%;height:100%;opacity:.55;animation-duration:85.4s}.clouds:after{left:-4%;top:42%;width:105%;height:70%;opacity:.35;animation-duration:104.81s}
.haze{position:absolute;left:0;right:0;top:50%;height:10%;background:linear-gradient(transparent,rgba(244,247,236,.55),rgba(220,233,230,.15),transparent);filter:blur(7px)}
.horizon{z-index:3;position:absolute;left:-2%;right:-2%;top:55%;height:2px;background:rgba(228,244,239,.72);box-shadow:0 0 10px rgba(222,245,244,.9)}
.ocean{z-index:2;position:absolute;left:0;right:0;top:55%;bottom:0;overflow:hidden;background:linear-gradient(#347f98 0%,#176b88 20%,#0b5577 47%,#073d60 72%,#052b4c 100%)}




/* Sun glitter is concentrated in a perspective-shaped path, but its edges are irregular. */
.sunpath{position:absolute;inset:0;background:radial-gradient(ellipse 18% 68% at 67% 0%,rgba(255,246,199,.30),rgba(224,239,225,.09) 65%,transparent 100%);mix-blend-mode:screen}
.reflections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:.96}
.fore{position:absolute;left:-8%;right:-8%;bottom:-5%;height:42%;background:linear-gradient(transparent,rgba(0,20,44,.2));transform:skewY(-.6deg);animation:fore 25.62s ease-in-out infinite alternate}

.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(2,17,29,.16) 100%)}
@keyframes cloud{from{transform:translateX(-2%)}to{transform:translateX(4%)}}


@keyframes surface{from{transform:translateY(-5px) scaleX(1.12) skewY(-.3deg)}to{transform:translateY(7px) scaleX(1.18) skewY(.3deg)}}
@keyframes cross{to{background-position:170px 0}}
@keyframes spark{from{transform:translateX(-5px);opacity:.78}to{transform:translateX(5px);opacity:.92}}

@keyframes fore{from{transform:translateX(-1.3%) skewY(-.12deg) scaleY(.99)}to{transform:translateX(1.3%) skewY(.12deg) scaleY(1.01)}}


/* Organic, non-repeating turbulence via SVG fractal noise, embedded in CSS. */
.grain,.fine-grain{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.grain{opacity:.34;mix-blend-mode:soft-light}
.fine-grain{opacity:.18;mix-blend-mode:overlay}




/* Nonuniform wave patches: staggered, different lengths, angles and cycles. */
.wavelets{position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
.wave-patch{position:absolute;overflow:visible;opacity:var(--alpha);transform-origin:50% 50%;filter:url(#crest-warp);animation:var(--roam) var(--period) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--delay)}
.wave-patch .crest{animation:waveAppear var(--fade-period) ease-in-out infinite;animation-delay:var(--fade-delay);}
.wave-patch .crest{fill:none;stroke:var(--crest-color,rgba(148,194,201,.46));stroke-width:var(--stroke);stroke-linecap:round}
.wave-patch .shadow{animation:waveAppear var(--fade-period) ease-in-out infinite;animation-delay:var(--fade-delay);}
.wave-patch .shadow{fill:none;stroke:var(--shadow-color,rgba(15,65,88,.22));stroke-width:calc(var(--stroke) * 3);stroke-linecap:round}
@keyframes patchSway{0%,100%{transform:translate(-1.4%,1.2%) rotate(-.4deg) scaleX(.96)}50%{transform:translate(1.7%,-1.4%) rotate(.5deg) scaleX(1.04)}}
/* Broad shading moves independently of the individual crests. */
.wave-shading{position:absolute;inset:-3%;pointer-events:none;mix-blend-mode:soft-light;opacity:.24;background:linear-gradient(174deg,transparent 7%,rgba(141,217,216,.10) 25%,transparent 36%,rgba(172,224,217,.13) 55%,transparent 72%,rgba(4,37,69,.14) 89%,transparent);filter:url(#shade-warp);animation:shadeSway 37s ease-in-out infinite alternate}
@keyframes shadeSway{0%,100%{transform:translate(-.6%,-.5%)}50%{transform:translate(.7%,.6%)}}
/* Small patches of water catching light, each with a different footprint and rhythm. */
.facet-field{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;overflow:hidden}
.facet{position:absolute;height:1px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(151,198,204,.32) 35%,rgba(191,217,215,.22) 63%,transparent);filter:blur(.65px);transform-origin:center;animation:facetFloat 24s ease-in-out infinite alternate}
.facet:nth-child(1){left:12%;top:32%;width:7%;opacity:.23;animation-duration:21s}
.facet:nth-child(2){left:61%;top:38%;width:12%;opacity:.3;animation-duration:27s;animation-delay:-9s}
.facet:nth-child(3){left:26%;top:56%;width:14%;opacity:.28;animation-duration:23s;animation-delay:-14s}
.facet:nth-child(4){left:78%;top:59%;width:8%;opacity:.25;animation-duration:30s;animation-delay:-5s}
.facet:nth-child(5){left:47%;top:72%;width:17%;opacity:.27;animation-duration:26s;animation-delay:-17s}
.facet:nth-child(6){left:8%;top:83%;width:20%;opacity:.17;animation-duration:34s;animation-delay:-12s}
.facet:nth-child(7){left:69%;top:89%;width:13%;opacity:.18;animation-duration:29s;animation-delay:-20s}
@keyframes facetFloat{0%,100%{transform:translate(-6px,2px) rotate(-1.2deg) scaleX(.85);opacity:.12}50%{transform:translate(8px,-4px) rotate(1.3deg) scaleX(1.14);opacity:.38}}
/* Uneven soft swell shadows help the crests read as surface relief. */
.depth-relief{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.19;background:linear-gradient(176deg,transparent 8%,rgba(2,30,57,.10) 23%,transparent 36%,rgba(1,28,52,.16) 59%,transparent 73%,rgba(0,20,42,.2) 90%);filter:url(#shade-warp);animation:reliefSway 39s ease-in-out infinite alternate}
@keyframes reliefSway{0%,100%{transform:translateY(-.6%) skewY(-.1deg)}50%{transform:translateY(.7%) skewY(.13deg)}}

@keyframes roam16{0%,100%{transform:translate(0.00%,0.00%)}25%{transform:translate(-0.31%,2.02%)}50%{transform:translate(-1.03%,0.88%)}75%{transform:translate(0.64%,-1.56%)}}

/* Long-period swells: broad vertical displacement and shading, deliberately out of phase. */
.swells{position:absolute;inset:-6% -8%;pointer-events:none;overflow:hidden;mix-blend-mode:soft-light}
.swell{position:absolute;left:-8%;width:116%;height:34%;opacity:.15;filter:blur(24px) url(#swell-warp);transform-origin:center;animation:swellLift var(--swell-period) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--swell-delay)}
.swell::before{content:"";position:absolute;inset:10% 0;background:linear-gradient(180deg,transparent 4%,rgba(153,198,202,.075) 33%,rgba(180,211,210,.10) 46%,rgba(18,65,91,.085) 61%,transparent 92%);transform:skewY(var(--swell-skew))}
.swell:nth-of-type(2){top:-10%;--swell-period:31s;--swell-delay:-18s;--swell-skew:-.55deg}
.swell:nth-of-type(3){top:15%;--swell-period:38s;--swell-delay:-7s;--swell-skew:.7deg;opacity:.13}
.swell:nth-of-type(4){top:44%;--swell-period:34s;--swell-delay:-25s;--swell-skew:-.8deg;opacity:.12}
.swell:nth-of-type(5){top:69%;--swell-period:43s;--swell-delay:-12s;--swell-skew:.45deg;opacity:.12}

.surface-coherence{position:absolute;inset:-5%;pointer-events:none;opacity:.11;mix-blend-mode:soft-light;background:linear-gradient(168deg,transparent 7%,rgba(188,221,216,.12) 31%,transparent 52%,rgba(8,53,80,.13) 73%,transparent 94%);filter:url(#coherence-warp);animation:coherence 47s cubic-bezier(.45,0,.55,1) infinite}
@keyframes coherence{0%,100%{transform:translate(-.45%,.25%) rotate(-.08deg)}37%{transform:translate(.55%,-.45%) rotate(.09deg)}71%{transform:translate(.1%,.5%) rotate(-.03deg)}}

/* 60-second test day/night cycle. All layers return exactly to their starting state. */
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background:linear-gradient(180deg,rgba(5,11,35,.86),rgba(15,34,66,.68) 46%,rgba(3,16,35,.58));opacity:0;mix-blend-mode:multiply;animation:nightfall 60s linear infinite}
.sky{animation:skyCycle 60s linear infinite}
.haze{animation:hazeCycle 60s linear infinite}
.ocean{animation:oceanCycle 60s linear infinite}
.stars{animation:starsCycle 60s linear infinite}
.daystar{position:absolute;left:67%;top:62%;width:5.5vmin;height:5.5vmin;margin:-2.75vmin 0 0 -2.75vmin;border-radius:50%;background:#fff8d8;box-shadow:0 0 22px rgba(255,244,190,.72),0 0 70px rgba(255,225,155,.28);z-index:1;animation:sunCycle 60s linear infinite;opacity:1}
.moon{position:absolute;left:28%;top:15%;width:4.3vmin;height:4.3vmin;border-radius:50%;background:#e8eff2;box-shadow:0 0 18px rgba(211,231,241,.42);opacity:0;z-index:1;animation:moonCycle 60s linear infinite;transform-origin:50% 820%}

.sunrise-glow{position:absolute;inset:40% 0 41%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 67% 100%,rgba(255,190,110,.58),rgba(255,128,83,.20) 28%,transparent 70%);opacity:0;filter:blur(8px);animation:twilightGlow 60s linear infinite}

@property --glow-x{syntax:"<percentage>";inherits:false;initial-value:90%}
@property --water-glow-x{syntax:"<percentage>";inherits:false;initial-value:90%}

/* Twilight colour is strongest near the true 55vh horizon, not across the whole sky. */
.sky::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(24,35,86,.48) 0%,rgba(116,83,139,.26) 43%,rgba(255,129,91,.64) 77%,rgba(255,204,125,.84) 100%);opacity:0;animation:twilightTint 60s linear infinite}

/* Diffuse glow travels horizontally with the setting/rising sun. */
.sunrise-glow{inset:auto 0 0;height:65%;background:radial-gradient(ellipse 28% 75% at var(--glow-x,90%) 100%,rgba(255,229,161,.95),rgba(255,153,100,.53) 38%,rgba(246,103,120,.13) 70%,transparent 100%);filter:blur(15px);animation:twilightGlow 60s linear infinite,glowTrack 60s linear infinite}
@keyframes glowTrack{0%{--glow-x:90%}50%{--glow-x:45%}100%{--glow-x:90%}}
/* The water takes on a copper tint only around the low sun. */
.ocean::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 40% 85% at var(--water-glow-x,90%) 0%,rgba(255,170,94,.48),rgba(198,91,112,.15) 48%,transparent 83%);mix-blend-mode:screen;animation:waterTwilight 60s linear infinite,waterGlowTrack 60s linear infinite}
@keyframes waterGlowTrack{0%{--water-glow-x:90%}50%{--water-glow-x:45%}100%{--water-glow-x:90%}}
@keyframes waterTwilight{0%,100%{opacity:.95}10%{opacity:.28}20%,35%{opacity:0}44%{opacity:.45}50%{opacity:1}60%{opacity:.08}65%,92%{opacity:0}97%{opacity:.58}}
/* Keep the reflection aligned with the sun instead of fixed at 67%. */
.sunpath{animation:reflectionCycle 60s linear infinite,sunpathTrack 60s linear infinite;background:radial-gradient(ellipse 18% 68% at var(--path-x,90%) 0%,rgba(255,231,167,.43),rgba(255,183,115,.13) 65%,transparent 100%)}
@keyframes sunpathTrack{0%{--path-x:90%}50%{--path-x:45%}100%{--path-x:90%}}

.sky .sunrise-glow{z-index:1}.sky .clouds{z-index:2}.sky::after{z-index:0}

/* Horizon and atmospheric haze must lose their daylight luminance at night. */
.horizon{animation:horizonDim 60s linear infinite}
@keyframes horizonDim{0%,100%{opacity:.55}8%{opacity:.85}18%,36%{opacity:1}45%{opacity:.75}51%{opacity:.38}60%{opacity:.07}68%,89%{opacity:.025}95%{opacity:.20}}
/* Override the original broad pale haze during full darkness. */
@keyframes hazeCycle{0%,100%{opacity:.65}10%{opacity:.9}18%,35%{opacity:1}45%{opacity:.75}52%{opacity:.34}62%{opacity:.06}70%,89%{opacity:.015}96%{opacity:.25}}
/* Avoid bright ocean-edge glints once the sun has fully set. */
@keyframes reflectionCycle{0%,100%{opacity:.42}8%{opacity:.70}20%{opacity:.92}25%{opacity:1}32%{opacity:.92}43%{opacity:.72}50%{opacity:.36}58%{opacity:.035}66%,91%{opacity:0}97%{opacity:.16}}
.daystar{animation:none!important;opacity:1!important}

/* SOLAR-LINKED LIGHTING: these replace the old clock-driven colour cycles. */
.sky,.ocean,.haze,.horizon,.sunrise-glow,.reflections,.sunpath{animation:none!important}
.sky::after,.ocean::after{animation:none!important}
.sky::after{opacity:var(--twilight,0)!important}
.ocean::after{opacity:var(--water-warmth,0)!important;--water-glow-x:var(--solar-x,50%)}
.sunrise-glow{opacity:var(--glow,0)!important;--glow-x:var(--solar-x,50%)}
.sunpath{opacity:var(--reflection,0)!important;--path-x:var(--solar-x,50%)}
.reflections{opacity:var(--reflection,0)!important}
.haze{opacity:var(--haze,0)!important}
.horizon{opacity:var(--horizon-brightness,0)!important}

/* Moon position and illuminated disk are computed from the selected instant. */
.moon{animation:none!important;transform:none!important;opacity:0;overflow:hidden;background:#142039;box-shadow:none;z-index:1}
.moon svg{width:100%;height:100%;display:block;overflow:visible}
.moon .moon-lit{fill:#e2e8e7}
.moon .moon-dark{fill:#152038}

/* Upward-tilted camera: more sky, lower sea horizon. */
.sky{height:76%!important}
.ocean{top:76%!important}
.celestial-clip{clip-path:inset(0 0 24% 0)!important}

/* Remove all legacy 55%-horizon overlays. The only horizon is the water at 76%. */
.horizon,.haze{display:none!important}
.sky{overflow:hidden!important}
.sky::after{background:linear-gradient(to bottom,rgba(35,36,83,.3),rgba(174,95,118,.18) 72%,rgba(255,164,109,.55))!important}
/* Layered irregular cloud banks with independent drift, scale and opacity. */
.clouds,.clouds::before,.clouds::after{animation:none!important;background:none!important;filter:none!important}
.clouds{position:absolute;inset:0!important;width:100%!important;height:100%!important;pointer-events:none;overflow:hidden}
.cloud-bank{position:absolute;left:-35%;width:155%;height:22%;opacity:var(--cloud-alpha,.38);filter:blur(var(--blur,13px));background:radial-gradient(ellipse 16% 30% at 12% 60%,rgba(245,248,251,.7),transparent 95%),radial-gradient(ellipse 20% 38% at 32% 42%,rgba(244,247,249,.67),transparent 95%),radial-gradient(ellipse 18% 27% at 53% 67%,rgba(239,244,248,.56),transparent 96%),radial-gradient(ellipse 22% 38% at 76% 49%,rgba(244,247,249,.6),transparent 96%),radial-gradient(ellipse 12% 25% at 95% 61%,rgba(245,248,251,.5),transparent 98%);animation:cloudDrift var(--speed,110s) linear infinite alternate,cloudBreathe var(--breathe,27s) ease-in-out infinite alternate;animation-delay:var(--delay,0s)}
@keyframes cloudDrift{from{transform:translateX(-8%) scaleX(.95)}to{transform:translateX(14%) scaleX(1.08)}}
@keyframes cloudBreathe{from{opacity:calc(var(--cloud-alpha,.38)*.65)}to{opacity:var(--cloud-alpha,.38)}}
/* Textured moon: subtle mare and crater relief, lit by the existing phase mask. */
.moon{background:transparent!important;border-radius:50%;box-shadow:0 0 7px #d6e4f02b!important}
.moon .moon-lit{fill:#cbd1d1!important}
.moon .moon-dark{fill:#111a2b!important}
.moon svg{filter:contrast(.94)}

/* Discrete, softly bounded cloud clusters instead of horizontal streaks. */
.cloud-bank{display:none!important}
.cloud-puff{position:absolute;width:var(--w);height:var(--h);left:var(--x);top:var(--y);border-radius:47% 53% 49% 51%;background:radial-gradient(ellipse at 48% 49%,rgba(239,244,249,.67) 0%,rgba(220,231,240,.42) 43%,rgba(210,222,232,.12) 67%,transparent 78%);filter:blur(var(--blur));opacity:calc(var(--cloud-light,.5)*var(--density,.5));animation:puffFloat var(--speed) ease-in-out infinite alternate;animation-delay:var(--delay)}
@keyframes puffFloat{from{transform:translate3d(-12px,4px,0) rotate(-4deg) scale(.94)}to{transform:translate3d(30px,-6px,0) rotate(5deg) scale(1.05)}}
/* Stars occupy the sky behind cloud coverage. */
.starfield{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--stars-visible,0)}
.starfield svg,.starfield canvas{display:block;width:100%;height:100%;overflow:hidden}
.sky .clouds{z-index:3!important}.sky .sunrise-glow{z-index:1!important}
.moon{overflow:visible!important}
.moon::before,.moon::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:-1}
.moon::before{width:650%;height:650%;background:radial-gradient(circle,rgba(213,229,246,.25) 0%,rgba(190,213,241,.12) 19%,rgba(160,192,228,.04) 42%,transparent 72%);opacity:var(--moon-halo,0);filter:blur(7px)}
.moon::after{width:180%;height:180%;background:radial-gradient(circle,rgba(235,242,255,.27),transparent 75%);opacity:var(--moon-halo,0);filter:blur(4px)}

/* Crisper cloud cores, with only a thin atmospheric feather at their edges. */
.cloud-puff{filter:blur(var(--blur))!important;background:radial-gradient(ellipse 28% 39% at 23% 57%,rgba(235,240,245,.8) 0 65%,transparent 100%),radial-gradient(ellipse 32% 45% at 46% 38%,rgba(243,246,250,.84) 0 64%,transparent 100%),radial-gradient(ellipse 27% 33% at 72% 56%,rgba(220,230,240,.76) 0 65%,transparent 100%),radial-gradient(ellipse 39% 30% at 52% 71%,rgba(209,220,233,.65) 0 70%,transparent 100%)!important}
.starfield svg .star-core{fill:#f8f9ff;stroke:#f8f9ff;stroke-width:1px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px rgba(205,224,255,.75)) drop-shadow(0 0 5px rgba(181,206,249,.25))}
.starfield svg .constellation-line{stroke:#9eb4d5;stroke-width:.45;opacity:.15;fill:none;vector-effect:non-scaling-stroke}
.clouds,.cloud-bank,.cloud-puff{display:none!important}
/* Prevent removed clouds from triggering paint or animation work. */
.clouds,.clouds::before,.clouds::after{display:none!important;animation:none!important}
</style>

  const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});

  const pad=n=>String(n).padStart(2,'0');
  const dateString=p=>`${p.year}-${pad(p.month)}-${pad(p.day)}`;
  const timeString=p=>`${pad(p.hour)}:${pad(p.minute)}`;
  function ukOffsetMinutes(d){const p=ukParts(d);return (Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-d.getTime())/60000;}
  function manualInstant(){
    if(!dateEl.value||!timeEl.value)return new Date();
    const [y,m,d]=dateEl.value.split('-').map(Number),[h,min]=timeEl.value.split(':').map(Number);
    const wall=Date.UTC(y,m-1,d,h,min);
    let utc=wall;
    for(let i=0;i<3;i++)utc=wall-ukOffsetMinutes(new Date(utc))*60000;
    return new Date(utc);
  }
  function solar(instant){
    const p=ukParts(instant);
    const year=p.year, n=Math.floor((Date.UTC(year,p.month-1,p.day)-Date.UTC(year,0,1))/86400000)+1;
    const days=((year%4===0&&year%100!==0)||year%400===0)?366:365;
    const hour=instant.getUTCHours()+instant.getUTCMinutes()/60+instant.getUTCSeconds()/3600+instant.getUTCMilliseconds()/3600000;
    const gamma=2*Math.PI/days*(n-1+(hour-12)/24);
    const eq=229.18*(.000075+.001868*Math.cos(gamma)-.032077*Math.sin(gamma)-.014615*Math.cos(2*gamma)-.040849*Math.sin(2*gamma));
    const dec=.006918-.399912*Math.cos(gamma)+.070257*Math.sin(gamma)-.006758*Math.cos(2*gamma)+.000907*Math.sin(2*gamma)-.002697*Math.cos(3*gamma)+.00148*Math.sin(3*gamma);
    const ha=(hour*60+eq+4*lon)/4-180, h=ha*rad, phi=lat*rad;
    const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(h))*deg;
    const east=-Math.cos(dec)*Math.sin(h);
    const north=Math.cos(phi)*Math.sin(dec)-Math.sin(phi)*Math.cos(dec)*Math.cos(h);
    const az=(Math.atan2(east,north)*deg+360)%360;
    return {alt,az};
  }
  const moon=document.querySelector('.moon');
  const moonLit=document.getElementById('moon-lit-shape');
  // Compact truncated lunar theory (Meeus mean elements and largest periodic terms).
  // Suitable for visual simulation, not precision navigation or eclipse prediction.
  function lunar(instant){
    const jd=instant.getTime()/86400000+2440587.5;
    const T=(jd-2451545)/36525;
    const sin=x=>Math.sin(x*rad),cos=x=>Math.cos(x*rad);
    const L=218.3164477+481267.88123421*T;
    const D=297.8501921+445267.1114034*T;
    const M=357.5291092+35999.0502909*T;
    const Mp=134.9633964+477198.8675055*T;
    const F=93.272095+483202.0175233*T;
    const lonMoon=L+6.289*sin(Mp)+1.274*sin(2*D-Mp)+.658*sin(2*D)+.214*sin(2*Mp)-.186*sin(M)-.114*sin(2*F)+.059*sin(2*D-2*Mp)+.057*sin(2*D-M-Mp)+.053*sin(2*D+Mp)+.046*sin(2*D-M);
    const beta=5.128*sin(F)+.280*sin(Mp+F)+.277*sin(Mp-F)+.173*sin(2*D-F)+.055*sin(2*D+F-Mp)+.046*sin(2*D-F-Mp)+.033*sin(2*D+F)+.017*sin(2*Mp+F);
    const distance=385001-20905*cos(Mp)-3699*cos(2*D-Mp)-2956*cos(2*D)-570*cos(2*Mp);
    const eps=23.439291-.0130042*T;
    const x=cos(beta)*cos(lonMoon),y=cos(beta)*sin(lonMoon)*cos(eps)-sin(beta)*sin(eps),z=cos(beta)*sin(lonMoon)*sin(eps)+sin(beta)*cos(eps);
    const ra=Math.atan2(y,x)*deg,dec=Math.asin(z)*deg;
    const gmst=280.46061837+360.98564736629*(jd-2451545)+.000387933*T*T;
    const ha=((gmst+lon-ra+540)%360)-180;
    const phi=lat*rad,h=ha*rad,delta=dec*rad;
    const geoAlt=Math.asin(Math.sin(phi)*Math.sin(delta)+Math.cos(phi)*Math.cos(delta)*Math.cos(h));
    const alt=geoAlt*deg-Math.asin(6378.14/distance)*deg*Math.cos(geoAlt);
    const east=-Math.cos(delta)*Math.sin(h);
    const north=Math.cos(phi)*Math.sin(delta)-Math.sin(phi)*Math.cos(delta)*Math.cos(h);
    const az=(Math.atan2(east,north)*deg+360)%360;
    const sunLon=(280.46646+36000.76983*T)+(1.914602-.004817*T)*sin(M)+.019993*sin(2*M);
    const phase=((lonMoon-sunLon)%360+360)%360;
    const elongCos=cos(beta)*cos(phase);
    const elong=Math.acos(Math.max(-1,Math.min(1,elongCos)));
    const sunDistance=149597870;
    const phaseAngle=Math.atan2(sunDistance*Math.sin(elong),distance-sunDistance*Math.cos(elong));
    const fraction=(1+Math.cos(phaseAngle))/2;
    return {alt,az,phase,fraction};
  }
  function drawMoon(fraction,waxing){
    // Exact illuminated projected fraction using an ellipse terminator.
    const k=2*fraction-1, pts=[];
    // Trace the lit side limb and then the terminator in reverse.
    const side=waxing?1:-1;
    for(let i=0;i<=40;i++){
      const theta=-Math.PI/2+Math.PI*i/40;
      pts.push([50+side*49*Math.cos(theta),50+49*Math.sin(theta)]);
    }
    for(let i=40;i>=0;i--){
      const theta=-Math.PI/2+Math.PI*i/40;
      pts.push([50-side*k*49*Math.cos(theta),50+49*Math.sin(theta)]);
    }
    const path='M'+pts.map(v=>v.map(n=>n.toFixed(2)).join(',')).join('L')+'Z';moonLit.setAttribute('d',path);document.getElementById('moon-phase-mask').setAttribute('d',path);
  }
  // 88 constellation figure data from Stellarium-derived public star positions.
  // This is fetched on demand; a 30-star offline fallback remains available.
  const fallbackStars=[
    [5.9195,7.407,.5],[5.2423,-8.202,.13],[5.4189,6.35,1.64],[5.6793,-1.943,1.74],
    [5.6036,-1.202,1.69],[5.5334,-.299,2.25],[5.7959,-9.67,2.07],[6.7525,-16.716,-1.46],
    [7.655,5.225,.34],[4.5987,16.509,.87],[5.2782,45.998,.08],[7.7553,28.026,1.14],
    [7.5767,31.888,1.58],[10.1395,11.967,1.35],[13.4199,-11.161,.97],
    [14.261,19.182,-.05],[16.4901,-26.432,1.06],[18.6156,38.783,.03],
    [20.6905,45.280,1.25],[19.8464,8.868,.77],[22.9608,-29.622,1.16],
    [23.0794,15.205,2.49],[23.0629,28.083,2.44],[.1398,29.09,2.06],
    [1.1622,35.621,2.05],[2.1196,23.462,2.01],[3.1361,40.956,2.12],
    [11.8177,14.572,2.14],[14.8479,-16.042,2.75],[17.5822,12.56,2.08]
  ];
  // Canvas 2D star layer: no per-star DOM nodes or GPU-specific API.
  // Catalogue records: [RA hours, declination degrees, visual magnitude, B-V colour index (optional)].
  const starCanvas=document.getElementById('star-map');
  const starCtx=starCanvas.getContext('2d');
  const stars=[];
  const starKeys=new Set();
  function addStar(ra,dec,mag,bv=0.65){
    if(![ra,dec,mag].every(Number.isFinite))return;
    const key=ra.toFixed(4)+','+dec.toFixed(4);
    if(starKeys.has(key))return;
    starKeys.add(key);stars.push({ra,dec,mag,bv});
  }
  fallbackStars.forEach(s=>addStar(...s));
  // Optional local catalogue file must define window.LOCAL_STARS as an array.
  // Do not fabricate stars to reach the 5,000 target.
  if(Array.isArray(window.LOCAL_STARS))window.LOCAL_STARS.forEach(s=>addStar(...s));
  const catalog=window.LOCAL_CONSTELLATIONS||[];
  for(const con of catalog){
    const entries=con.STARS||con.stars||null;
    for(const line of (con.LINES||con.data?.lines||[])){
      const points=line.INDICES?.map(i=>entries?.[i])||line.stars||[];
      for(const item of points){
        addStar(Number(item.RA??item.ra),Number(item.DEC??item.DE??item.dec),Number(item.MAG??item.mag??4),Number(item.BV??item.bv??0.65));
      }
    }
  }
  let lastStarUpdate=0;
  function project(ra,dec,sidereal){
    const h=((sidereal-ra*15+540)%360-180)*rad,delta=dec*rad,phi=lat*rad;
    const alt=Math.asin(Math.sin(phi)*Math.sin(delta)+Math.cos(phi)*Math.cos(delta)*Math.cos(h))*deg;
    const az=(Math.atan2(-Math.cos(delta)*Math.sin(h),Math.cos(phi)*Math.sin(delta)-Math.sin(phi)*Math.cos(delta)*Math.cos(h))*deg+360)%360;
    const offset=((az-180+540)%360)-180;
    return {x:500+offset*7.5,y:(76-alt*.92)/76*760,visible:alt>0&&Math.abs(offset)<67,alt};
  }
  function updateStars(instant){
    const rect=starCanvas.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    const scale=Math.min(devicePixelRatio||1,1.25);
    const w=Math.round(rect.width*scale),h=Math.round(rect.height*scale);
    if(starCanvas.width!==w||starCanvas.height!==h){starCanvas.width=w;starCanvas.height=h;}
    starCtx.setTransform(w/1000,0,0,h/760,0,0);
    starCtx.clearRect(0,0,1000,760);
    const jd=instant.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
    const sidereal=((280.46061837+360.98564736629*(jd-2451545)+.000387933*T*T+lon)%360+360)%360;
    for(const star of stars){
      const p=project(star.ra,star.dec,sidereal);
      if(!p.visible||p.y<0||p.y>760||p.x<0||p.x>1000)continue;
      const extinction=Math.max(0,Math.min(1,p.alt/18));
      const brightness=Math.min(1,Math.pow(10,-.2*(star.mag-1.5)))*extinction;
      if(brightness<.012)continue;
      const bv=Math.max(-.4,Math.min(2,star.bv));
      const rgb=bv<.35?'200,220,255':bv>1.15?'255,196,155':bv>.75?'255,231,205':'245,245,255';
      starCtx.fillStyle=`rgba(${rgb},${Math.max(.08,brightness).toFixed(3)})`;
      const radius=Math.max(.30,Math.min(1.10,1.03-.11*star.mag));
      // A shadow glow avoids creating a radial gradient for every star.
      starCtx.shadowBlur=brightness>.08?radius*3.5:0;
      starCtx.shadowColor=`rgba(${rgb},${(brightness*.38).toFixed(3)})`;
      starCtx.fillStyle=`rgba(${rgb},${Math.max(.08,brightness).toFixed(3)})`;
      starCtx.beginPath();starCtx.arc(p.x,p.y,radius,0,Math.PI*2);starCtx.fill();
    }
    starCtx.shadowBlur=0;
  }
  let previewStart=performance.now(),previewDate=new Date();
  const yearOptions=document.getElementById('year-options');
  const yearDuration=document.getElementById('year-duration');
  let yearStartDate='',yearStartTime='',yearStartMs=0,yearEndMs=0;
  function startYearPreview(){
    yearStartDate=dateEl.value;
    yearStartTime=timeEl.value;
    const [y,m,d]=yearStartDate.split('-').map(Number);
    yearStartMs=Date.UTC(y,m-1,d);
    yearEndMs=Date.UTC(y+1,m-1,d);
    previewStart=performance.now();
  }
  function yearInstant(now){
    const duration=Math.max(10,Math.min(3600,Number(yearDuration.value)||60))*1000;
    const progress=((now-previewStart)%duration)/duration;
    const dayIndex=Math.floor(progress*((yearEndMs-yearStartMs)/86400000));
    const day=new Date(yearStartMs+dayIndex*86400000).toISOString().slice(0,10);
    dateEl.value=day;
    timeEl.value=yearStartTime;
    return manualInstant(); // handles BST/GMT changes at the fixed UK clock time
  }
  const startParts=ukParts(new Date());
  if(dateEl){dateEl.value=dateString(startParts);timeEl.value=timeString(startParts);}
  modeEl?.addEventListener('change',()=>{
    const manual=modeEl.value==='manual',year=modeEl.value==='year';
    dateEl.disabled=!(manual||year);timeEl.disabled=!(manual||year);
    yearOptions.hidden=!year;
    if(manual){const p=ukParts(new Date());dateEl.value=dateString(p);timeEl.value=timeString(p);}
    if(year)startYearPreview();
    if(modeEl.value==='preview'){previewStart=performance.now();previewDate=manualInstant();}
  });
  dateEl?.addEventListener('change',()=>{if(modeEl.value==='year')startYearPreview();});
  timeEl?.addEventListener('change',()=>{if(modeEl.value==='year')startYearPreview();});
  yearDuration?.addEventListener('change',()=>{if(modeEl.value==='year')startYearPreview();});
  let lastStatus=0;
  const skyLayer=document.querySelector('.sky');
  const oceanLayer=document.querySelector('.ocean');
  let lastFrame=-Infinity;
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden || now-lastFrame<50)return; // 20 Hz, real elapsed time retained
    lastFrame=now;
    const mode=modeEl?.value||'live';
    let instant;
    if(mode==='manual')instant=manualInstant();
    else if(mode==='year')instant=yearInstant(now);
    else if(mode==='preview')instant=new Date(previewDate.getTime()+((now-previewStart)%60000)/60000*86400000);
    else instant=new Date();
    const {alt,az}=solar(instant);
    const lunarNow=lunar(instant);
    const moonOffset=((lunarNow.az-180+540)%360)-180;
    moon.style.left=(50+moonOffset*.75)+'%';
    moon.style.top=(76-lunarNow.alt*.92)+'%';
    // Water layer clips the Moon at the horizon, without opacity animation.
    moon.style.opacity=1;
    drawMoon(lunarNow.fraction,lunarNow.phase<180);
    const moonlight=Math.max(0,Math.min(1,(lunarNow.alt+2)/14))*lunarNow.fraction;
    moon.style.setProperty('--moon-halo',moonlight.toFixed(3));

    const offset=((az-180+540)%360)-180;
    sun.style.left=(50+offset*.75)+'%';
    sun.style.top=(76-alt*.92)+'%';
    // Lighting uses exactly the same calculated solar altitude and azimuth.
    const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
    const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
    const daylight=smooth(-8,8,alt);
    document.documentElement.style.setProperty('--stars-visible',((1-smooth(-17,-5,alt))*(1-.45*moonlight)).toFixed(3));
    document.documentElement.style.setProperty('--cloud-light',(0.09+0.63*daylight+0.21*moonlight).toFixed(3));
    if(now-lastStarUpdate>500){updateStars(instant);lastStarUpdate=now;}
    const direct=smooth(-2,8,alt);
    const twilight=smooth(-15,-5,alt)*(1-smooth(2,13,alt));
    const glow=smooth(-10,-2,alt)*(1-smooth(5,18,alt));
    const lerp=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
    const rgb=a=>`rgb(${a.join(',')})`;
    const skyTop=lerp([6,12,31],[105,175,215],daylight);
    const skyMid=lerp([13,25,51],[194,223,233],daylight);
    const skyLow=lerp([22,33,61],[232,229,213],daylight);
    const seaTop=lerp([7,24,43],[52,127,152],daylight);
    const seaLow=lerp([3,13,29],[5,43,76],daylight);
    const sky=skyLayer,ocean=oceanLayer;
    sky.style.background=`linear-gradient(${rgb(skyTop)},${rgb(skyMid)} 75%,${rgb(skyLow)})`;
    ocean.style.background=`linear-gradient(${rgb(seaTop)},${rgb(lerp([5,20,37],[23,107,136],daylight))} 20%,${rgb(lerp([4,18,35],[11,85,119],daylight))} 47%,${rgb(lerp([3,15,31],[7,61,96],daylight))} 72%,${rgb(seaLow)})`;
    const solarX=clamp(50+offset*.75,-20,120)+'%';
    const root=document.documentElement;
    root.style.setProperty('--solar-x',solarX);
    root.style.setProperty('--twilight',(twilight*.85).toFixed(3));
    root.style.setProperty('--glow',(glow*.9).toFixed(3));
    root.style.setProperty('--water-warmth',(glow*.75).toFixed(3));
    root.style.setProperty('--reflection',direct.toFixed(3));
    root.style.setProperty('--haze',(daylight*.85+twilight*.2).toFixed(3));
    root.style.setProperty('--horizon-brightness',(daylight*.8+twilight*.08).toFixed(3));
    if(statusEl&&now-lastStatus>250){
      const p=ukParts(instant);
      statusEl.textContent=`${dateString(p)} ${timeString(p)} UK · sun ${alt.toFixed(1)}° · moon ${lunarNow.alt.toFixed(1)}° · lit ${(lunarNow.fraction*100).toFixed(0)}%`;
      lastStatus=now;
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
